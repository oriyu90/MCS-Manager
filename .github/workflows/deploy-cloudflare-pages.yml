name: Deploy website to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - favicon.svg
      - og-image.png
      - robots.txt
      - sitemap.xml
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy public website files
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://mcs-manager.pages.dev/

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pages-dist
          cp index.html favicon.svg og-image.png robots.txt sitemap.xml .pages-dist/
          test "$(find .pages-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "5"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=mcs-manager --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
