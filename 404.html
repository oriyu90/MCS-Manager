<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07090d">
  <meta name="robots" content="noindex,follow">
  <title>ページが見つかりません — MCS Manager</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f5f7fb;
      background: #07090d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid #354258;
      background: #0c1017;
    }
    .code {
      margin: 0 0 28px;
      color: #55a5ff;
      font: 650 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: .16em;
    }
    h1 {
      max-width: 10ch;
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 6rem);
      line-height: 1;
      letter-spacing: -.055em;
    }
    p { max-width: 34rem; margin: 26px 0 0; color: #929bad; line-height: 1.8; }
    a {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      margin-top: 34px;
      padding: 0 20px;
      border-radius: 8px;
      color: #04101e;
      background: #55a5ff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #77b8ff; }
    a:focus-visible { outline: 3px solid #a7d0ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 / NOT FOUND</p>
    <h1>そのページは、見つかりません。</h1>
    <p>URLが変更されたか、ページが削除された可能性があります。MCS Managerのトップページから目的の情報を探してください。</p>
    <a href="/">トップページへ戻る</a>
  </main>
</body>
</html>
